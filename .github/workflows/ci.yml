name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall app streamlit_app.py
      - run: pytest -q
      - run: docker build -f Dockerfile.api -t synthetic-lab-api .
      - run: docker build -f Dockerfile.streamlit -t synthetic-lab-ui .
