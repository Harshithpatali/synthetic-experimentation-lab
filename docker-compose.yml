services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: synthetic_lab
      POSTGRES_USER: synthetic
      POSTGRES_PASSWORD: synthetic
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthetic -d synthetic_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://synthetic:synthetic@db:5432/synthetic_lab
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "8501:8501"

volumes:
  pgdata:
