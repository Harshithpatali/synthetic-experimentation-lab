name = "synthetic-experimentation-lab"
main = "src/index.js"
compatibility_date = "2026-10-06"
workers_dev = true

[observability]
enabled = true

[secrets]
required = ["DATABASE_URL"]

[[containers]]
class_name = "Backend"
image = "./Dockerfile.api"
max_instances = 1
instance_type = "basic"

[[durable_objects.bindings]]
name = "BACKEND"
class_name = "Backend"

[[migrations]]
new_sqlite_classes = ["Backend"]
tag = "v1"
