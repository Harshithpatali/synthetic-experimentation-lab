name = "synthetic-experimentation-lab"
main = "src/index.js"
compatibility_date = "2026-10-06"
workers_dev = true

[observability]
enabled = true

[secrets]
required = ["DATABASE_URL"]

[[containers]]
class_name = "Backend"
image = "./backend/Dockerfile"
max_instances = 1

[[durable_objects.bindings]]
name = "BACKEND"
class_name = "Backend"

[exports.Backend]
type = "durable-object"
storage = "sqlite"
